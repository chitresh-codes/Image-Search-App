<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image-search-app</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">

      <h1>Image Search App</h1>

      <form>
        <input type="text" id="search-input" placeholder="Search for images..." />
        <button id="search-button">Search</button>
      </form>

      <div class="search-results">
        <!-- 1st image -->
        <div class="search-result">
          <img
            src="https://images.unsplash.com/photo-1776549821171-fd5b5d310f30?w=700&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwyNHx8fGVufDB8fHx8fA%3D%3D"
            alt="image"
          />
          <a
            href="https://unsplash.com/photos/tower-bridge-over-the-river-thames-in-london-_3UmV7sf-ZY"
            target="_blank"
            rel="noopener noreferrer"
            >an image of bridge
          </a>
        </div>

        <!-- 2nd image -->
        <div class="search-result">
          <img src="https://plus.unsplash.com/premium_photo-1661919589683-f11880119fb7?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8ZGVsaGl8ZW58MHx8MHx8fDA%3D"
               alt="image"
          />

          <a
            href="https://unsplash.com/photos/tower-bridge-over-the-river-thames-in-london-_3UmV7sf-ZY"
            target="_blank"
            rel="noopener noreferrer"
            >an image of bridge
          </a>
        </div>

        <!-- 3rd image -->
        <div class="search-result">
          <img
            src="https://images.unsplash.com/photo-1530281700549-e82e7bf110d6?q=80&w=688&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="image"
          />
          <a
            href="https://unsplash.com/photos/tower-bridge-over-the-river-thames-in-london-_3UmV7sf-ZY"
            target="_blank"
            rel="noopener noreferrer"
            >an image of bridge
          </a>
        </div>
      </div>

      <button id="show-more-button">Show more</button>

    </div>
    <script src="index.js"></script>
  </body>
</html>
